services:
  # ===== load balancer =====
  haproxy:
    image: haproxy:3.0-alpine
    platform: linux/amd64
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "16M"

  # ===== instancia 1 da api =====
  api1:
    image: ghcr.io/carvalhocaio/rinha-fraud@sha256:8fb9e4ce4bab6bc98a0d62d0ffca5c5ca34de4c526f81a99512f3d40d32d0d20
    platform: linux/amd64
    volumes:
      - sockets:/sockets
    environment:
      - FAISS_NPROBE=${FAISS_NPROBE:-4}
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
    command: >
      sh -c 'rm -f /sockets/api1.sock &&
      granian --interface asgi
      --uds /sockets/api1.sock --uds-permissions 666
      --workers 1 --runtime-threads 1
      --loop uvloop --backlog 4096 --no-ws
      src.app:app'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "167M"

  # ====== instancia 2 da api =====
  api2:
    image: ghcr.io/carvalhocaio/rinha-fraud@sha256:8fb9e4ce4bab6bc98a0d62d0ffca5c5ca34de4c526f81a99512f3d40d32d0d20
    platform: linux/amd64
    volumes:
      - sockets:/sockets
    environment:
      - FAISS_NPROBE=${FAISS_NPROBE:-4}
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
    command: >
      sh -c 'rm -f /sockets/api2.sock &&
      granian --interface asgi
      --uds /sockets/api2.sock --uds-permissions 666
      --workers 1 --runtime-threads 1
      --loop uvloop --backlog 4096 --no-ws
      src.app:app'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "167M"

volumes:
  sockets:
